# espd.conf — 进程外 ESP daemon 配置
# 位置：/data/local/tmp/.esp/espd.conf
# 首次启动由 supervisor 从模块 bin/ 拷入；已存在不覆盖（升级时保留你的校准值）。

# ---- 目标进程 ----
pkg=com.tencent.KiHan
so=libil2cpp.so
port=29000
interval_ms=33

# ---- 类 / 字段（按名字自解析，游戏更新后类名不变就不用改）----
pvp_ns=KH
pvp_class=PVPStatis
pvp_static_field=statis
field_my_actor=m_myPlayerCtrl
field_enemy_actor=m_enemyPlayerCtrl

camera_ns=UnityEngine
camera_class=Camera

# Transform 字段（UnityEngine.Transform，标准名；换了再用 espd scan 查）
field_local_position=m_LocalPosition
field_local_rotation=m_LocalRotation
field_local_scale=m_LocalScale
field_father=m_Father

# ---- 投影校准 ----
# fov / near / far 需按当前游戏相机实测；先用默认，线位置不对时用 espd scan + 真机微调
fov=60
near=0.3
far=1000
# screen_w/h=0 表示运行时从 /sys 读；读不到兜底 1080x2400，也可在此写死
screen_w=0
screen_h=0
